name: fraudml_default
random_seed: 42
data:
  val_ratio: 0.2
  data_dir: data/raw
  engine: pandas
  data_format: csv
feature_store:
  enabled: true
  db_path: artifacts/feature_store.db
features:
  config_path: config.yaml
  steps:
  - TargetEncoderFeature:
      smoothing: 50.0
      min_samples: 10
  - CategoricalEncoder
  - TimeFeature
  - AmountFeature
  - DeviceFeature
  - EmailFeature
  - CardFeature
  - AddrFeature
  - HistoryFeature:
      name: HistoryFeature_1h
      window_seconds: 3600
  - HistoryFeature:
      name: HistoryFeature_1day
      window_seconds: 86400
  - MissingPatternFeature
  - AggregationFeature
  - CrossFeature
  - SequenceFeature:
      embed_dim: 32
      max_seq_len: 20
      epochs: 10
      batch_size: 256
  - GraphFeature
selection:
  iv_threshold: 0.005
  iv_bins: 10
  vif_threshold: 10.0
  vif_max_iter: 50
  psi_threshold: 0.25
model:
  type: lightgbm
  params:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    scale_pos_weight: auto
cv:
  enabled: false
  n_splits: 5
  purge_gap: 0
calibration:
  enabled: false
  method: platt
  cv_folds: 3
  n_jobs: -1
interpretability:
  enabled: true
  max_features: 20
  n_samples: 100
tree_analysis:
  enabled: true
  max_rules_per_tree: 5
  min_paths: 10
  trace:
    enabled: true
    n_samples: 3
    top_n_trees: 5
risk_decision:
  enabled: false
  cost_fp: 10.0
  cost_fn: 500.0
  medium_threshold: 0.3
  high_threshold: 0.7
evaluation:
  top_k_pct: 0.05
model_comparison:
  enabled: false
  models:
  - lr
  - lightgbm
  metrics:
  - auc
  - ks
  - brier
  - logloss
threshold:
  cost_fp: 10.0
  cost_fn: 500.0
monitoring:
  auc_threshold: 0.7
output:
  dir: artifacts
mlflow:
  enabled: true
  experiment_name: fraudml
  run_name: null
  tracking_uri: null
  registry:
    enabled: false
    model_name: fraudml
    stage: Staging
checkpoint:
  force_refresh: false
serving:
  host: 0.0.0.0
  port: 8000
  model_artifact_dir: null
  model_name: null
  model_stage: Production
  mlflow_tracking_uri: null
  feature_store_db: artifacts/feature_store.db
