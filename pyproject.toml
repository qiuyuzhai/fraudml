[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudml"
version = "0.1.0"
description = "End-to-end fraud detection pipeline with feature store, online serving, and MLflow registry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FraudML" }]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.0.0",
    "lightgbm>=4.0.0",
    "xgboost>=1.6.0",
    "catboost>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "mlflow>=2.10.0",
    "optuna>=3.0.0",
    "shap>=0.42.0",
    "matplotlib>=3.5.0",
    "statsmodels>=0.14.0",
    "scipy>=1.9.0",
    "joblib>=1.2.0",
    "torch>=2.0.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
fraudml-train = "src.train:main"
fraudml-score = "src.batch_score:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
