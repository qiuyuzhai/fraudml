# FraudML — Full Configuration (All Features Enabled)
#
# Usage (PowerShell):
#   python src/train.py --config-name config_full
#   python src/train.py --config-name config_full "selection.iv_threshold=0.01"
#
# This config enables all advanced features by default:
#   - CV (cross-validation)
#   - Calibration (probability calibration)
#   - Interpretability (SHAP-based explanation)
#   - TreeAnalysis (tree-based customer profiling)
#   - RiskDecision (multi-level risk engine)
#   - ModelComparison (multi-model benchmark)
#
# Feature pipeline uses three-layer architecture (see config.yaml for details):
#   Layer 1: Generic (stateless, foundational)
#   Layer 2: Fraud-Domain (entity-aware, behavioral)
#   Layer 3: Business-Domain (graph-based, heavy computation)

name: fraudml_full

random_seed: 42
evaluate_on_finish: true

data:
  val_ratio: 0.2
  data_dir: data/raw
  engine: polars          # 'pandas' | 'polars'：polars 加载+聚合更快
  data_format: parquet    # 'csv' | 'parquet'：parquet 读取速度快 3-5 倍

features:
  config_path: config.yaml
  steps:
    # ========== Layer 1: 通用基础特征 (Generic) ==========
    - TargetEncoderFeature:
        name: "TargetEncoderFeature_high"
        smoothing: 50.0
        min_samples: 10
        encode_cols: ["card1", "addr1", "P_emaildomain", "card2", "card5"]
    - TargetEncoderFeature:
        name: "TargetEncoderFeature_low"
        smoothing: 200.0
        min_samples: 30
        encode_cols: ["card1", "addr1"]
    - CategoricalEncoder
    - TimeFeature
    - AmountFeature

    # ========== Layer 2: 欺诈领域特征 (Fraud-Domain) ==========
    - DeviceFeature
    - EmailFeature
    - CardFeature
    - AddrFeature
    - HistoryFeature:
      name: "HistoryFeature_multi"
      window: [600, 3600, 21600, 86400, 604800]
      stats: ["count", "mean", "std", "min", "max"]
      agg_cols: ["TransactionAmt"]
    - VelocityFeature
    - MissingPatternFeature
    - AggregationFeature
    - CrossFeature:
        name: "CrossFeature_card_addr"
        cross_pairs:
          - ["card1", "addr1"]
          - ["card1", "card2"]
          - ["card1", "addr2"]
    - CrossFeature:
        name: "CrossFeature_email_device"
        cross_pairs:
          - ["P_emaildomain", "DeviceType"]
          - ["P_emaildomain", "id_30"]
          - ["DeviceType", "id_31"]

    # ========== Layer 3: 业务领域特征 (Business-Domain) ==========
    - SequenceFeature:
        model_type: cnn
        embed_dim: 64
        max_seq_len: 30
        epochs: 20
        batch_size: 512
        feature_cols: ["TransactionAmt", "dist1", "dist2", "C1", "C2", "C3"]
        device: auto
    - GraphFeature

selection:
  iv_threshold: 0.005
  iv_bins: 10
  vif_threshold: 10.0
  vif_max_iter: 50
  psi_threshold: 0.25

model:
  type: lightgbm
  n_trials: 20
  params:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    scale_pos_weight: auto

cv:
  enabled: false          # 交叉验证关闭：5 折会让训练时间 ×5，val 集已够评估
  n_splits: 5
  purge_gap: 0

calibration:
  enabled: true
  method: platt
  cv_folds: 3
  n_jobs: -1

interpretability:
  enabled: true
  max_features: 20
  n_samples: 100

tree_analysis:
  enabled: true
  max_rules_per_tree: 5
  min_paths: 10
  trace:
    enabled: true
    n_samples: 3          # 挑几笔高风险样本
    top_n_trees: 5        # 详细追踪前 N 棵树
risk_decision:
  enabled: true
  cost_fp: 10.0
  cost_fn: 500.0
  medium_threshold: 0.3
  high_threshold: 0.7

evaluation:
  top_k_pct: 0.05

model_comparison:
  enabled: true
  models:
    - lr
    - lightgbm
    - xgboost
    - catboost
    - random_forest
  metrics:
    - auc
    - ks
    - brier
    - logloss

threshold:
  cost_fp: 10.0
  cost_fn: 500.0

monitoring:
  auc_threshold: 0.7

output:
  dir: artifacts

mlflow:
  enabled: true
  experiment_name: fraudml
  run_name: null
  tracking_uri: null
  registry:
    enabled: true           # 训练完自动注册到 Model Registry
    model_name: fraudml
    stage: Staging          # 初始 stage；晋升 Production 为独立手动步骤

checkpoint:
  force_refresh: false

logging:
  level: INFO
  file: null